<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Card</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <i class="fa-regular fa-map"></i>
        <p>New York City, NY</p>
      </div>
      <div class="avatar-image"></div>

      <div class="image">
        <img src="images/images(Dicaptio).jpg" alt="Leonardo Dicaption" />
      </div>

      <div class="user-info">
        <h1>Leonardo Dicaprio</h1>
        <p>Leonardo DiCaprio is a famous actor and climate change activist</p>
        <button>Follow</button>
      </div>

      <div class="footer">
        <div class="section posts">
          <i class="fa-regular fa-image"></i>
          <div class="text-block">
            <p>Posts</p>
            <p class="number">635</p>
          </div>
        </div>
        <div class="section favorites">
          <i class="fa-regular fa-heart"></i>
          <div class="text-block">
            <p>Favorites</p>
            <p class="number">3,472</p>
          </div>
        </div>
        <div class="section messages">
          <i class="fa-regular fa-paper-plane"></i>
          <div class="text-block">
            <p>Messages</p>
            <p class="number">1,239</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
